name: eproxy Core tests
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Tests and race detector
        run: go test -race -count=1 ./...
      - name: Static analysis
        run: go vet ./...
      - name: LuCI UI runtime contract
        run: |
          node --check package/luci-app-eproxy/htdocs/luci-static/resources/view/eproxy/settings.js
          node tests/luci_ui.test.js
      - name: Real OpenWrt UCI CLI and procd script smoke
        run: |
          go run ./cmd/eproxy -uci package/eproxy-core/files/eproxy.config -check-config
          go run ./cmd/eproxy -config examples/direct.json -check-config
          sh -n package/eproxy-core/files/eproxy.init
          python3 -m json.tool package/luci-app-eproxy/root/usr/share/rpcd/acl.d/luci-app-eproxy.json > /dev/null
      - name: Linux arm64 cross compile
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o dist/eproxy-linux-arm64 ./cmd/eproxy
          file dist/eproxy-linux-arm64
      - name: Upload experimental core binary
        uses: actions/upload-artifact@v4
        with:
          name: eproxy-linux-arm64-EXPERIMENTAL
          path: dist/eproxy-linux-arm64
          retention-days: 7
