name: eproxy OpenWrt SDK — IPK and APK
on:
  push:
    paths: ['cmd/**', 'internal/**', 'package/**', 'go.mod', '.github/workflows/sdk-package.yml']
  pull_request:
    paths: ['cmd/**', 'internal/**', 'package/**', 'go.mod', '.github/workflows/sdk-package.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eproxy-dual-sdk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: '24.10.8'
            gcc: '13.3.0'
            sha256: '1a2aa6b3c54ee2cd07c2552a34abb5cb15fe6ca596b76007849a68361b0985b5'
            extension: 'ipk'
            openwrt_commit: '0b795ce79e23b553aa184080c390f9ce92a2b6d4'
          - version: '25.12.6'
            gcc: '14.3.0'
            sha256: '4ce05fafa54286032e3e2de80806256965812507b6abdf7c7e7a615bdf5dc94f'
            extension: 'apk'
            openwrt_commit: '64900e756efa667774214f9c6b17c113222e01f7'
    steps:
      - uses: actions/checkout@v4
      - name: Install SDK requirements
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y zstd build-essential gcc g++ gawk gettext git python3 python3-setuptools rsync unzip file wget curl libncurses-dev libssl-dev
      - name: Official SDK with pinned SHA-256
        env:
          VERSION: ${{ matrix.version }}
          GCC_VERSION: ${{ matrix.gcc }}
          SHA256: ${{ matrix.sha256 }}
        run: |
          SDK="openwrt-sdk-$VERSION-qualcommax-ipq807x_gcc-${GCC_VERSION}_musl.Linux-x86_64.tar.zst"
          curl --fail --location --retry 3 --output sdk.tar.zst "https://downloads.openwrt.org/releases/$VERSION/targets/qualcommax/ipq807x/$SDK"
          echo "$SHA256  sdk.tar.zst" | sha256sum --check
          mkdir -p sdk
          tar --use-compress-program=unzstd -xf sdk.tar.zst -C sdk --strip-components=1
      - name: Match official firmware release feed revisions
        env:
          VERSION: ${{ matrix.version }}
        run: |
          curl --fail --location --retry 3 --output feeds.buildinfo "https://downloads.openwrt.org/releases/$VERSION/targets/qualcommax/ipq807x/feeds.buildinfo"
          grep -E '^src-git (packages|luci) ' feeds.buildinfo > sdk/feeds.conf
          test "$(wc -l < sdk/feeds.conf)" = 2
          cat sdk/feeds.conf
      - name: Match base libraries to official OpenWrt SDK release
        env:
          VERSION: ${{ matrix.version }}
          OPENWRT_COMMIT: ${{ matrix.openwrt_commit }}
        run: |
          git clone --depth 1 --filter=blob:none --branch "v$VERSION" https://github.com/openwrt/openwrt.git openwrt-base
          test "$(git -C openwrt-base rev-parse HEAD)" = "$OPENWRT_COMMIT"
          test -f openwrt-base/package/utils/lua/Makefile
          test -f openwrt-base/package/utils/ucode/Makefile
          echo "src-link base $GITHUB_WORKSPACE/openwrt-base/package" >> sdk/feeds.conf
      - name: Install Go, LuCI and base development packages
        run: |
          cd sdk
          ./scripts/feeds update base packages luci
          ./scripts/feeds install -p base lua ucode
          ./scripts/feeds install -p packages golang
          ./scripts/feeds install -p luci luci-base
          test -f package/feeds/base/lua/Makefile
          test -f package/feeds/base/ucode/Makefile
      - name: Copy sources into package buildroot
        run: |
          cp -R package/eproxy-core sdk/package/eproxy-core
          cp -R package/luci-app-eproxy sdk/package/luci-app-eproxy
          mkdir -p sdk/package/eproxy-core/src
          cp go.mod LICENSE sdk/package/eproxy-core/src/
          cp -R cmd internal sdk/package/eproxy-core/src/
      - name: Verify eproxy Kconfig selection
        run: |
          cd sdk
          printf '\nCONFIG_PACKAGE_eproxy-core=m\nCONFIG_PACKAGE_luci-app-eproxy=m\nCONFIG_PACKAGE_liblua=m\nCONFIG_PACKAGE_libucode=m\n' >> .config
          make defconfig
          grep -E '^CONFIG_PACKAGE_(eproxy-core|luci-app-eproxy)=' .config
          grep -Eq '^CONFIG_PACKAGE_eproxy-core=[my]$' .config
          grep -Eq '^CONFIG_PACKAGE_luci-app-eproxy=[my]$' .config
      - name: Compile SDK-omitted LuCI Lua/ucode development headers
        run: |
          cd sdk
          make -j2 package/feeds/base/lua/compile package/feeds/base/ucode/compile V=s
          sh -c 'test -f staging_dir/target-*/usr/include/lua.h'
          sh -c 'test -f staging_dir/target-*/usr/include/ucode/module.h'
      - name: Compile OpenWrt packages
        run: |
          cd sdk
          make -j2 package/eproxy-core/compile package/luci-app-eproxy/compile V=s
          find bin/packages -name '*eproxy*.${{ matrix.extension }}' -print
          test "$(find bin/packages -name 'eproxy-core_*.${{ matrix.extension }}' | wc -l)" -gt 0
          test "$(find bin/packages -name 'luci-app-eproxy_*.${{ matrix.extension }}' | wc -l)" -gt 0
      - name: Upload experimental installable packages
        uses: actions/upload-artifact@v4
        with:
          name: eproxy-openwrt-${{ matrix.version }}-ipq807x-${{ matrix.extension }}-experimental
          path: sdk/bin/packages/**/*eproxy*.${{ matrix.extension }}
          retention-days: 7
